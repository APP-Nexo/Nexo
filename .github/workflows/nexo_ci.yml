name: Nexo CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Check formatting
        run: npx @biomejs/biome ci .

  test:
    name: Test - ${{ matrix.test-file }}
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        test-file:
          - health
          - auth
          - master
          - admin
          - search
          - me
          - social
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: NexoAPI
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Generate certs
        run: bash certs/generate
      - name: Setup database
        run: npx prisma db push --accept-data-loss && npx tsx prisma/seeds/index.ts
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/NexoAPI?schema=public
      - name: Run ${{ matrix.test-file }} tests
        run: npx vitest run src/tests/${{ matrix.test-file }}.test.ts --reporter=verbose
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/NexoAPI?schema=public
          NODE_ENV: test
          SECRET: ci-secret
          TOKEN_TYPE: Bearer
          TOKEN_EXPIRES: 15m
          REFRESH_TOKEN_EXPIRES: 7d
