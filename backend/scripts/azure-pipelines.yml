trigger:
  branches:
    include:
      - main
      - develop

pool:
  vmImage: ubuntu-latest

services:
  postgres:
    image: postgres:16-alpine
    env:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: NexoAPI
    ports:
      - 5432:5432

variables:
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/NexoAPI?schema=public
  NODE_ENV: test
  SECRET: ci-only-secret-with-at-least-32-characters
  TOKEN_TYPE: Bearer
  TOKEN_EXPIRES: 15m
  REFRESH_TOKEN_EXPIRES: 7d

steps:
  - task: NodeTool@0
    inputs:
      versionSpec: 22.x

  - script: npm ci
    displayName: Install dependencies
    workingDirectory: $(Build.SourcesDirectory)/backend

  - script: npm audit --omit=dev --audit-level=high
    displayName: Audit production dependencies
    workingDirectory: $(Build.SourcesDirectory)/backend

  - script: npm run generate
    displayName: Generate Prisma client
    workingDirectory: $(Build.SourcesDirectory)/backend

  - script: npm run format:check
    displayName: Check code formatting
    workingDirectory: $(Build.SourcesDirectory)/backend

  - script: npm run typecheck
    displayName: Typecheck
    workingDirectory: $(Build.SourcesDirectory)/backend

  - script: npm run test:ci
    displayName: Run migrations, seeds and tests
    workingDirectory: $(Build.SourcesDirectory)/backend

  - script: npm run build
    displayName: Build backend
    workingDirectory: $(Build.SourcesDirectory)/backend
